# Recordatorios de ADS (HU-17): cada 30 minutos llama a la API en Render, que
# envía los recordatorios pendientes (servicio próximo, cotización sin responder
# y pago pendiente). Render gratuito no tiene tareas programadas.
#
# GitHub solo ejecuta los workflows programados desde la rama por defecto (main).
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   ADS_API_URL      https://ads-api-4o89.onrender.com
#   REMINDERS_TOKEN  el mismo valor de REMINDERS_TOKEN en Render → ads-api → Environment
name: Recordatorios

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar recordatorios
        env:
          API_URL: ${{ secrets.ADS_API_URL }}
          TOKEN: ${{ secrets.REMINDERS_TOKEN }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$TOKEN" ]; then
            echo "Faltan los secretos ADS_API_URL o REMINDERS_TOKEN; no se envía nada."
            exit 0
          fi
          # Los reintentos cubren el arranque en frío del plan gratuito (~1 min)
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 90 \
            -X POST "$API_URL/api/internal/reminders/" \
            -H "X-Reminders-Token: $TOKEN"
