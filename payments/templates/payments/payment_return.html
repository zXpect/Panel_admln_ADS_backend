<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>ADS · Volver a la app</title>
    <style>
        :root { --bg:#f4f6f8; --card:#fff; --text:#1d2433; --muted:#5f6b7a; --border:#dde3ea; --primary:#1565c0; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background:var(--bg); color:var(--text); }
        main { max-width:420px; margin:0 auto; padding:48px 16px; text-align:center; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; }
        h1 { font-size:18px; margin:0 0 8px; }
        p { color:var(--muted); font-size:14px; margin:0 0 20px; }
        a.button { display:block; padding:14px; border-radius:8px; background:var(--primary); color:#fff;
                   font-size:16px; font-weight:600; text-decoration:none; }
    </style>
</head>
<body>
<main>
    <div class="card">
        <h1>Pago procesado</h1>
        <p>Vuelve a ADS para ver el estado de tu pago.</p>
        <a class="button" id="back" href="{{ intent_link }}">Volver a ADS</a>
    </div>
</main>
<script>
    // Intento automático; si el navegador lo bloquea, queda el botón
    window.location.replace("{{ deep_link|escapejs }}");
</script>
</body>
</html>
