# Blueprint de Render (D23): API Django + PostgreSQL.
# Guía paso a paso en README.md, sección «Despliegue en Render».
# Las variables con sync: false se escriben a mano en el panel de Render
# (nunca en este archivo). La credencial de Firebase va como Secret File.
databases:
  - name: ads-db
    databaseName: ads
    user: ads
    plan: free          # vence a los 30 días: pasar a basic-256mb antes (D23)
    region: virginia

services:
  - type: web
    name: ads-api
    runtime: python
    plan: free
    region: virginia
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py createcachetable
    startCommand: gunicorn admin_panel.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ads-db
          property: connectionString
      # p. ej. ads-api.onrender.com
      - key: ALLOWED_HOSTS
        sync: false
      # p. ej. https://ads-api.onrender.com,https://<panel>
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # URL del panel admin (React)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        value: /etc/secrets/serviceAccountKey.json
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      # Pagos: en producción solo wompi (el mock no arranca)
      - key: PAGOS_MODO
        value: wompi
      - key: WOMPI_BASE_URL
        value: https://sandbox.wompi.co/v1
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
